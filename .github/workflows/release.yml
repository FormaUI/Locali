# Publishes a release from its signed vX.Y.Z tag on main. The release check of FormaUI/Versioning, at the release Locali
# follows, holds the tag first; the package candidate's full gate built and verified is then attached to the tag's
# GitHub release with its digest, and published to nuget.org through trusted publishing. A failed publication runs again
# for the same tag.
name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    permissions:
      # The release-packages step writes the tag's GitHub release.
      contents: write
      actions: read
      pull-requests: read
      # nuget.org exchanges the job's OIDC token for a key that lasts an hour, through its policy for this workflow.
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Hold the tag to the release check
        id: check
        uses: FormaUI/Versioning/actions/release-check@68ff74cadbe94084384d29be93466713fd989b53 # v1.0.0-preview.1
        with:
          gate-workflow: full.yml
          version-command: "([xml] (Get-Content src/Forma.Locali/Forma.Locali.csproj)).SelectSingleNode('//PropertyGroup/Version').InnerText"
          packages-artifact: packages

      - name: Attach the release's packages
        id: packages
        uses: FormaUI/Versioning/actions/release-packages@68ff74cadbe94084384d29be93466713fd989b53 # v1.0.0-preview.1
        with:
          gate-run-id: ${{ steps.check.outputs.gate-run-id }}
          packages-artifact: packages
          name: Locali

      # The user is the nuget.org account that made the policy.
      - name: Get a nuget.org key
        id: login
        uses: NuGet/login@v1
        with:
          user: soyeyalon

      # A package nuget.org holds already was published by an earlier run for this tag; pushing a package pushes its
      # symbol package beside it.
      - name: Publish to nuget.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          PACKAGES: ${{ steps.packages.outputs.directory }}
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($package in Get-ChildItem -LiteralPath $env:PACKAGES -Filter '*.nupkg') {
              $archive = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
              try {
                  $entry = $archive.Entries | Where-Object { $_.FullName -notmatch '/' -and $_.Name -like '*.nuspec' } | Select-Object -First 1
                  $reader = [System.IO.StreamReader]::new($entry.Open())
                  try {
                      $metadata = ([xml] $reader.ReadToEnd()).package.metadata
                  }
                  finally {
                      $reader.Dispose()
                  }
              }
              finally {
                  $archive.Dispose()
              }

              $index = Invoke-RestMethod "https://api.nuget.org/v3-flatcontainer/$($metadata.id.ToLowerInvariant())/index.json" -SkipHttpErrorCheck -StatusCodeVariable status
              if ($status -eq 200 -and $index.versions -contains $metadata.version.ToLowerInvariant()) {
                  Write-Host "nuget.org already holds $($metadata.id) $($metadata.version)."
                  continue
              }

              dotnet nuget push $package.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json
              if ($LASTEXITCODE -ne 0) {
                  throw "Pushing $($package.Name) to nuget.org failed."
              }
          }
