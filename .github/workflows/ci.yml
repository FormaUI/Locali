# Runs the fast gate a person runs, then lints Forma, which lints clean, so anything reported there is a regression. It
# runs on every push but main's, which promotion fast-forwards to a commit candidate's full gate passed, and on every
# pull request.
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a pull request supersedes the older run; every commit on a branch keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      # The solution references Forma's runtime beside it, so both repositories are checked out side by side, Forma at the branch its runtime is developed on.
      - uses: actions/checkout@v7
        with:
          path: Forma.Locali

      - uses: actions/checkout@v7
        with:
          repository: FormaUI/Forma
          ref: dev
          path: formaui-net

      # The SDK Forma pins, which is the one the linter is built and run with.
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: formaui-net/global.json

      - name: Run the gate
        working-directory: Forma.Locali
        run: pwsh ./build.ps1

      - name: Lint Forma
        working-directory: Forma.Locali
        run: |
          dotnet restore ../formaui-net/Forma.slnx
          dotnet run --project src/Forma.Locali --no-build -- --path ../formaui-net/Forma.slnx --exclude "*/Fixtures/*"
